<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>簽到管理後台</title>
<style>
:root {
  --bg: #f0f4f8; --card: #ffffff; --accent: #4a9e78; --accent-light: #d4ede2;
  --warn: #d96060; --text: #2d2420; --text-mid: #5a6a7a; --text-dim: #9aacbc;
  --border: #e0e8f0; --shadow: 0 2px 12px rgba(0,0,0,.08); --radius: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Microsoft JhengHei', 'Noto Sans TC', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

#header {
  background: linear-gradient(135deg, #2d6a50, #4a9e78); color: #fff;
  padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
  box-shadow: 0 3px 12px rgba(45,106,80,.3); flex-wrap: wrap; gap: 10px;
}
#header h1 { font-size: 1.2rem; font-weight: 700; }
#header .sub { font-size: .8rem; opacity: .75; margin-top: 2px; }
.header-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.hdr-btn {
  padding: 8px 16px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.4);
  background: rgba(255,255,255,.15); color: #fff; font-size: .85rem;
  cursor: pointer; font-family: inherit; transition: all .2s; white-space: nowrap;
}
.hdr-btn:hover { background: rgba(255,255,255,.28); }
.hdr-btn.danger { border-color: #ffaaaa; color: #ffd0d0; }
.hdr-btn.danger:hover { background: rgba(220,80,80,.25); }

/* 來源切換 */
#sourceBar {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
  font-size: .85rem; color: var(--text-mid);
}
.src-btn {
  padding: 6px 16px; border-radius: 20px; border: 1.5px solid var(--border);
  background: #f5f5f5; color: var(--text-mid); cursor: pointer; font-family: inherit;
  font-size: .82rem; transition: all .2s;
}
.src-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
#loadingMsg { color: var(--accent); font-size: .82rem; display: none; }

#stats { display: flex; gap: 12px; padding: 16px 20px; flex-wrap: wrap; }
.stat-card { flex: 1; min-width: 110px; background: var(--card); border-radius: var(--radius); padding: 14px 18px; box-shadow: var(--shadow); text-align: center; }
.stat-num { font-size: 2rem; font-weight: 700; color: var(--accent); }
.stat-label { font-size: .78rem; color: var(--text-mid); margin-top: 3px; }

#searchBar { margin: 0 20px 14px; display: flex; gap: 10px; }
#searchInput { flex: 1; padding: 10px 14px; border: 1.5px solid var(--border); border-radius: 9px; font-size: .95rem; font-family: inherit; background: var(--card); color: var(--text); }
#searchInput:focus { outline: none; border-color: var(--accent); }

#tableWrap { margin: 0 20px 20px; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; min-width: 600px; }
thead { background: linear-gradient(90deg, #2d6a50, #4a9e78); color: #fff; }
th { padding: 12px 14px; text-align: left; font-weight: 600; white-space: nowrap; }
td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #f6faf8; }
.idx-badge { display: inline-block; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-light); color: var(--accent); font-size: .75rem; font-weight: 700; text-align: center; line-height: 24px; }
.sig-thumb { width: 80px; height: 36px; border: 1px solid var(--border); border-radius: 5px; object-fit: contain; background: #fafafa; cursor: pointer; }
.sig-thumb:hover { border-color: var(--accent); }
.no-sig { color: var(--text-dim); font-size: .8rem; }
#noData { text-align: center; padding: 40px; color: var(--text-dim); display: none; }

#emptyMsg { display: none; text-align: center; padding: 60px 20px; color: var(--text-dim); }
#emptyMsg .icon { font-size: 3rem; margin-bottom: 12px; }

/* 燈箱 */
#lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 999; align-items: center; justify-content: center; }
#lightbox.show { display: flex; }
#lightbox img { max-width: 90vw; max-height: 80vh; background: #fff; border-radius: 10px; padding: 12px; box-shadow: 0 8px 40px rgba(0,0,0,.4); }
#lightbox .close-btn { position: absolute; top: 20px; right: 20px; width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); border: none; color: #fff; font-size: 1.4rem; cursor: pointer; }

.note { font-size: .75rem; color: var(--text-dim); padding: 8px 20px 16px; }

@media print {
  body { background: #fff; }
  .no-print { display: none !important; }
  #tableWrap { box-shadow: none; margin: 0; border-radius: 0; }
}
</style>
</head>
<body>

<div id="header">
  <div>
    <h1>📋 簽到管理後台</h1>
    <div class="sub" id="hdrSub">從 Google Sheets 即時讀取</div>
  </div>
  <div class="header-btns no-print">
    <button class="hdr-btn" onclick="loadData()">🔄 重新整理</button>
    <button class="hdr-btn" onclick="exportCSV()">⬇ 匯出 CSV</button>
    <button class="hdr-btn" onclick="window.print()">🖨 列印名單</button>
  </div>
</div>

<!-- 資料來源切換 -->
<div id="sourceBar" class="no-print">
  <span>資料來源：</span>
  <button class="src-btn active" id="btnSheets" onclick="switchSource('sheets')">☁ Google Sheets</button>
  <button class="src-btn" id="btnLocal" onclick="switchSource('local')">💾 本機紀錄（含簽名）</button>
  <span id="loadingMsg">⏳ 讀取中…</span>
</div>

<div id="stats">
  <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-label">總簽到人數</div></div>
  <div class="stat-card"><div class="stat-num" id="statOrgs">0</div><div class="stat-label">單位數</div></div>
  <div class="stat-card"><div class="stat-num" id="statLatest">—</div><div class="stat-label">最後簽到時間</div></div>
</div>

<div id="searchBar" class="no-print">
  <input type="text" id="searchInput" placeholder="🔍 搜尋姓名 / 單位 / 職稱…" oninput="renderTable()">
</div>

<div id="tableWrap">
  <table id="dataTable">
    <thead><tr id="tableHead"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="noData">查無符合資料</div>
</div>

<div id="emptyMsg">
  <div class="icon">📭</div>
  <div>尚無簽到記錄</div>
  <div style="font-size:.85rem;margin-top:8px" id="emptyHint"></div>
</div>

<div class="note no-print" id="sourceNote">
  ☁ Sheets 模式：顯示所有裝置的簽到紀錄（無簽名圖片）｜切換至「本機紀錄」可查看此瀏覽器的簽名
</div>

<!-- 燈箱 -->
<div id="lightbox" onclick="closeLightbox()">
  <button class="close-btn">✕</button>
  <img id="lightboxImg" src="" alt="簽名">
</div>

<script>
// ── 設定（與 index.html 相同的 scriptUrl）──
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzRhAY3Py9gLV5yUF_TpRxo7jTs-yPnfHUnnM4CSmmrcmDNMw4GfxEeR2E7t_8PjacU/exec';

let records = [];
let source = 'sheets'; // 'sheets' | 'local'

// ── 切換資料來源 ──
function switchSource(s) {
  source = s;
  document.getElementById('btnSheets').classList.toggle('active', s === 'sheets');
  document.getElementById('btnLocal').classList.toggle('active', s === 'local');
  document.getElementById('sourceNote').textContent = s === 'sheets'
    ? '☁ Sheets 模式：顯示所有裝置的簽到紀錄（無簽名圖片）｜切換至「本機紀錄」可查看此瀏覽器的簽名'
    : '💾 本機模式：只顯示此瀏覽器送出的紀錄，包含手寫簽名圖片';
  loadData();
}

// ── 讀取資料 ──
async function loadData() {
  document.getElementById('loadingMsg').style.display = 'inline';
  if (source === 'sheets') {
    await loadFromSheets();
  } else {
    loadFromLocal();
  }
  document.getElementById('loadingMsg').style.display = 'none';
  updateStats();
  renderTable();
  const hasData = records.length > 0;
  document.getElementById('tableWrap').style.display = hasData ? '' : 'none';
  document.getElementById('emptyMsg').style.display = hasData ? 'none' : 'block';
  document.getElementById('searchBar').style.display = hasData ? '' : 'none';
  document.getElementById('emptyHint').textContent = source === 'sheets'
    ? '請確認 Google Sheets 是否有資料，或切換至「本機紀錄」查看'
    : '尚未在此瀏覽器完成簽到';
}

async function loadFromSheets() {
  try {
    const res = await fetch(SCRIPT_URL + '?action=getData');
    const json = await res.json();
    // Sheets 欄位：#, 簽到時間, 姓名, 服務單位, 職稱, 聯絡電話, 身分證後4碼, 活動名稱
    records = json.map(r => ({
      time:     r['簽到時間'] || '',
      name:     r['姓名']     || '',
      org:      r['服務單位'] || '',
      jobTitle: r['職稱']     || '',
      phone:    r['聯絡電話'] || '',
      idLast4:  r['身分證後4碼'] || '',
      event:    r['活動名稱'] || '',
      signature: null,
    }));
  } catch(err) {
    alert('讀取 Google Sheets 失敗：' + err.message + '\n\n請確認網路連線，或切換至「本機紀錄」');
    records = [];
  }
}

function loadFromLocal() {
  records = JSON.parse(localStorage.getItem('signins') || '[]');
}

// ── 統計 ──
function updateStats() {
  document.getElementById('statTotal').textContent = records.length;
  document.getElementById('statOrgs').textContent = new Set(records.map(r => r.org).filter(Boolean)).size;
  if (records.length) {
    const last = String(records[records.length - 1].time || '');
    document.getElementById('statLatest').textContent = last.includes(' ') ? last.split(' ').slice(-2).join(' ') : last;
  } else {
    document.getElementById('statLatest').textContent = '—';
  }
}

// ── 渲染表格 ──
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const filtered = records.filter(r =>
    !q || [r.name, r.org, r.jobTitle].some(v => v && v.toString().toLowerCase().includes(q))
  );

  // 動態表頭
  const hasSig = source === 'local';
  document.getElementById('tableHead').innerHTML =
    ['#','簽到時間','姓名','服務單位','職稱','聯絡電話','身分證後4碼', hasSig ? '簽名' : ''].filter(Boolean)
    .map(h => `<th>${h}</th>`).join('');

  const tbody = document.getElementById('tableBody');
  const noData = document.getElementById('noData');
  if (!filtered.length) { tbody.innerHTML = ''; noData.style.display = 'block'; return; }
  noData.style.display = 'none';
  tbody.innerHTML = filtered.map((r, i) => `
    <tr>
      <td><span class="idx-badge">${i + 1}</span></td>
      <td style="white-space:nowrap;font-size:.8rem;color:#6b8090">${esc(r.time)}</td>
      <td><strong>${esc(r.name)}</strong></td>
      <td>${esc(r.org)}</td>
      <td>${esc(r.jobTitle)}</td>
      <td>${esc(r.phone || '—')}</td>
      <td>${esc(r.idLast4 || '—')}</td>
      ${hasSig ? `<td>${r.signature
        ? `<img class="sig-thumb" src="${r.signature}" onclick="openLightbox('${r.signature}')">`
        : '<span class="no-sig">—</span>'}</td>` : ''}
    </tr>`).join('');
}

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 燈箱 ──
function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('show'); }
function closeLightbox() { document.getElementById('lightbox').classList.remove('show'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

// ── 匯出 CSV ──
function exportCSV() {
  if (!records.length) { alert('尚無資料可匯出'); return; }
  const headers = ['#','簽到時間','姓名','服務單位','職稱','聯絡電話','身分證後4碼'];
  const rows = records.map((r,i) => [i+1, r.time, r.name, r.org, r.jobTitle, r.phone||'', r.idLast4||'']
    .map(v => `"${String(v).replace(/"/g,'""')}"`).join(','));
  const csv = '﻿' + [headers.join(','), ...rows].join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  a.download = `簽到名單_${new Date().toLocaleDateString('zh-TW')}.csv`;
  a.click();
}

// ── 啟動 ──
loadData();
// 每 30 秒自動重新整理（Sheets 模式）
setInterval(() => { if (source === 'sheets') loadData(); }, 30000);
</script>
</body>
</html>
